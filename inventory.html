<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mulish:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="./css/styles.css">
    <script src="./js/inventory.js" defer></script>
</head>
<body>
    <!-- Titlebar: branding, quick links -->
    <header class="container py-1 smoke-bg">
        <div class="row justify-content-between align-items-center">
            <div class="col">
                <img src="./img/travis-logo-sml-172x26.png" alt="Travis cars logo">
            </div>
            <div class="navbar col m-0 p-0">
                <ul class="nav">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link disabled" href="#">Inventory</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">About Us</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Contact</a></li>
                </ul>
            </div>
        </div>
    </header>

    <main class="container-fluid col-md-10 col-12">
        <h1 class="text-center mb-4">Our Inventory</h1>
        <div class="d-flex border-100 border rounded mb-4 p-2 w-100 justify-content-center align-items-center ">
            <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" id="hideSoldSwitch">
                <label class="form-check-label" for="hideSoldSwitch">Hide Sold Vehicles</label>
            </div>
        </div>

        <!-- JS will add cards to this container -->
        <div class="row justify-content-center gap-2 pb-4" id="card-container">
            </div>
    </main>


    <!-- Footer Section -->
    <footer class="container-fluid bg-dark text-light py-4 justify-content-around">

        <div class="row justify-content-around align-items-center">

            <!-- Footer branding -->
            <div class="col-4">
                <div class="d-flex flex-column justify-content-center align-items-center gap-2">
                    <img src="./img/travis-logo-188x188.png" alt="" class="img-fluid col-3">
                    <p class="">Your trusted car dealership.</p>
                </div>
            </div>

            <!-- Contacts -->
            <div class="col-4">
                <div class="d-flex gap-2 align-items-center">
                        <img src="./img/telephone-icon-256.png" alt="phone icon" class="img-fluid col-1" style="filter: invert(80%);">
                        <p class="m-0">07715 642379</p>
                    </div>
                    <div class="d-flex gap-2 align-items-center">
                        <img src="./img/email-icon-2-256.png" alt="email icon" class="img-fluid col-1" style="filter: invert(80%);">
                        <p class="m-0">sales@traviscars.co.uk</p>
                    </div>
                    <div class="d-flex gap-2 align-items-center">
                        <img src="./img/maps-and-flags.png" alt="address icon" class="img-fluid col-1" style="filter: invert(80%);">
                        <p class="m-0">Rivadale View, Ilkley, LS29 8ER, United Kingdom</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Copyright -->
        <p class="text-center">Copyright (c) Travis Cars 2025</p>
    </footer>

    <!-- Modal for car details -->
    <div class="modal" id="carModal" data-bs-toggle="modal">
        <div class="modal-dialog modal-dialog-centered modal-xl">
            <div class="modal-content">

                <div class="modal-header">
                    <h1 class="modal-title" id="carModalTitle">Car title</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div>
                        <img src="#" class="d-block w-100" alt="Car image" id="carModalImage">
                    </div>
                    <div class="container-fluid">
                        <div class="row justify-content-center">
                            <div class="col-12 col-md-4 p-4 shadow" id="carModalCol1">
                                <div class="d-flex justify-content-between align-items-center">
                                    <div class="d-flex gap-1" id="carModalPillBox">
                                        <span class="badge bg-secondary" id="carModalPillMiles">Pill Miles</span>
                                        <span class="badge bg-secondary" id="carModalPillOwners">Pill Own</span>
                                        <span class="badge bg-secondary" id="carModalPillYear">Pill Yr</span>
                                    </div>
                                    <div class="d-flex justify-content-between align-items-center">
                                        <p id="carModalPrice" class="fs-5 fw-bold m-0">£00,000</p>
                                        <span class="badge bg-primary fs-5" id="carModalPillSold">SOLD</span>
                                    </div>
                                </div>
                                <div id="carModalSubTitle" class="fs-6 fw-normal pt-1 m-1 ps-0">
                                    Subtitle
                                </div>
                                <p class="mt-3 mb-0">Features</p>
                                <ul class="m-0" id="carModalFeaturesList">
                                    <!-- Features will be added here -->
                                </ul>
                                <p class="mt-3 mb-0">Specifics</p>
                                <ul class="m-0" id="carModalSpecificsList">
                                    <!-- Specifics will be added here -->
                                </ul>
                            </div>

                            <div class="col-12 col-md-8 py-4 px-3" id="carModalCol2"></div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</body>
</html>
